<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Погода в реальному часі</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 400px; width: 100%; border-left: 5px solid #3b82f6; text-align: center; }
        h1 { color: #ffffff; margin-top: 0; }
        .temp { font-size: 3rem; color: #60a5fa; font-weight: bold; margin: 20px 0; }
        p { font-size: 1.1rem; color: #b0b0b0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Погода: {{ city }}</h1>
        <div class="temp">{{ temperature }} °C</div>
        <p>Швидкість вітру: {{ wind }} км/год</p>
    </div>
</body>
</html>
